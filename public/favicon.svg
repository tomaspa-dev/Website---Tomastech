<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Rounded Container (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#bgGrad)" stroke="#2e3856" stroke-width="8" />
  
  <!-- Sleek Glowing Border Accent -->
  <rect x="36" y="36" width="440" height="440" rx="112" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Tech "T" Monogram with High-End Geometric Architecture -->
  <g filter="url(#softGlow)">
    <!-- Horizontal Top Bar -->
    <path d="M120 162C120 144.327 134.327 130 152 130H360C377.673 130 392 144.327 392 162C392 179.673 377.673 194 360 194H152C134.327 194 120 179.673 120 162Z" fill="url(#primaryGrad)" />
    
    <!-- Vertical Pillar -->
    <path d="M224 162C224 144.327 238.327 130 256 130C273.673 130 288 144.327 288 162V350C288 367.673 273.673 382 256 382C238.327 382 224 367.673 224 350V162Z" fill="url(#primaryGrad)" />
    
    <!-- Core Center Tech Node -->
    <circle cx="256" cy="162" r="15" fill="#ffffff" />
    
    <!-- Bottom Accent Node -->
    <circle cx="256" cy="350" r="10" fill="#38bdf8" />
  </g>
</svg>
